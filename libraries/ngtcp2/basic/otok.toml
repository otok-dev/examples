# ngtcp2 (with its OpenSSL crypto helper) as its recipe builds it by default, for every Apple platform, every Android ABI, Windows (MSVC) and Linux
# (GCC); Android, Windows and Linux in both configurations. Each target in an output of its own. The linkage is the
# target's default (static) unless a profile changes it.
[otok]
format = 1

[apple]
platforms = ["macosx", "catalyst", "ios", "iossim", "tvos", "tvossim", "watchos", "watchossim", "xros", "xrossim"]
deployment = { macos = "12.0", ios = "15.0", tvos = "15.0", watchos = "8.0", visionos = "1.0" }
# Apple Watch's arm64 exists only from watchOS 26: below it, arm64_32 alone
architectures = { watchos = ["arm64_32"] }
output = "Otok/apple"

[android]
deployment = { android = "24" }
configurations = ["debug", "release"]
output = "Otok/android"

[windows]
build-on = ["windows/msvc"]
configurations = ["debug", "release"]
output = "Otok/windows"

[linux]
build-on = ["linux/gcc"]
configurations = ["debug", "release"]
output = "Otok/linux"

[deps.ngtcp2]
recipe = "apotocki/ngtcp2"
version = "~> 1.26"
