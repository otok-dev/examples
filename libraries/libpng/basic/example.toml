# Write an image to PNG in memory and read it back: libpng and its zlib.
[example]
description = "Encode a small RGBA image to PNG in memory with the simplified API and decode it again."
sources = ["main.c"]

[consumer]
package = "PNG"
link = ["PNG::PNG"]
products = ["PNG"]
swift-sources = ["main.swift"]     # the Swift program of the SwiftPM consumer, importing the module PNG
consumers = ["cmake", "msbuild", "swiftpm", "gradle"]
