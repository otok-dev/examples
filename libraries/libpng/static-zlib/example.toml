# libpng dynamic, zlib static inside it (otok decision 136).
[example]
description = "A dynamic libpng holding a static zlib: zlib's headers reach the program, its code stays hidden in libpng."
issue = "https://github.com/otok-dev/otok, docs/PLAN.md decision 136"
